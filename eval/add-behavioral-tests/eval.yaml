name: add-behavioral-tests-eval
description: Evaluate the add-behavioral-tests skill — scaffolding pytest behavioral tests for agents
skill: agentic-starter-kits-skills:add-behavioral-tests

execution:
  mode: case
  arguments: "{agent_path} {jira_key}"
  timeout: 1800
  env:
    KUBECONFIG: $KUBECONFIG

runner:
  type: claude-code

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6
  hook: claude-sonnet-4-6

permissions:
  allow:
    - "Bash"
    - "Read"
    - "Write"
    - "Edit"
    - "Skill"
  deny: []

mlflow:
  experiment: add-behavioral-tests-eval

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: YAML file with fields:
      - 'agent_path' (string): relative path under agents/ (e.g., 'crewai/websearch_agent')
        ([EXTERNAL: OpenShift + agentic-starter-kits repo] — the agent must exist
        in the agents/ directory and be deployable to the target OpenShift cluster)
      - 'jira_key' (string): Jira ticket key for this work
        ([EXTERNAL: Jira] — must be a real ticket in the Jira instance)
    - annotations.yaml: Expected outcomes:
      - 'has_tools' (bool): whether the agent has tools (affects test_tool_usage.py)
      - 'supports_streaming' (bool): whether agent emits standard delta.tool_calls
      - 'has_mlflow_tracing' (bool): whether agent has MLflow tracing integrated
      - 'expected_test_files' (list): test files that should be created
      - 'expected_modified_files' (list): existing files that should be modified
    - answers.yaml: LLM answerer guidance for interactive questions:
      - Jira context decisions (if Jira MCP unavailable)
      - deploy-agents prompts (redeploy/reuse)
      - MLflow tracing bug filing decisions

inputs:
  tools:
    - match: |
        Questions asked to the user via AskUserQuestion — the skill asks
        about Jira tickets, parent epics, deployment confirmations,
        and agent bug filing decisions.
      prompt: |
        Answer based on the test case context in input.yaml and answers.yaml.
        For Jira ticket questions: use the jira_key from input.yaml.
        For deployment confirmations: answer "redeploy" for existing agents.
        For bug filing: answer "yes" to log bugs under the parent epic.
        For parent epic: use the value from answers.yaml if provided.

outputs:
  - path: output
    schema: |
      The skill creates/modifies files across the agentic-starter-kits repo.
      Primary artifacts created:
      1. agents/<framework>/<agent>/tests/behavioral/ directory with:
         - conftest.py (standardized fixtures with MLflow enrichment)
         - test_tool_usage.py (F1 tool selection scoring)
         - test_response_quality.py (coherence scoring)
         - test_cost_latency.py (latency thresholds)
         - test_reliability.py (pass@k, pytest.mark.slow)
         - test_streaming_parity.py (optional, if standard streaming)
         - fixtures/golden_queries.yaml
      2. Modified files:
         - tests/behavioral/configs/thresholds.yaml (agent section added)
         - pyproject.toml (pytest marker added)
         - 3 documentation files updated

      Judges should use {{ conversation }} for process verification and
      check modified_files for content validation.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: budget_check
    builtin: cost_budget
    arguments:
      max_cost_usd: 15.0

  - name: test_files_created
    description: |
      Verify the core behavioral test files were created. Check for conftest.py,
      test_tool_usage.py (if agent has tools), test_response_quality.py,
      test_cost_latency.py, test_reliability.py, and golden_queries.yaml.
    check: |
      modified = outputs.get("modified_files", {})
      files = outputs.get("files", {})
      all_files = {**files, **modified}
      conversation = outputs.get("conversation", "")
      annotations = outputs.get("annotations", {})
      expected = annotations.get("expected_test_files", [
          "conftest.py", "test_response_quality.py",
          "test_cost_latency.py", "test_reliability.py"
      ])
      has_tools = annotations.get("has_tools", True)
      if has_tools:
          expected.append("test_tool_usage.py")
      found = []
      missing = []
      for f in expected:
          if any(f in k for k in all_files) or f in conversation:
              found.append(f)
          else:
              missing.append(f)
      if missing:
          return (False, f"Missing test files: {missing}")
      return (True, f"All {len(found)} expected test files found")

  - name: conftest_mlflow_enrichment
    description: |
      Verify conftest.py has the mandatory MLflow enrichment pattern with all
      4 required elements: asyncio.to_thread, try/except, logging.warning,
      warnings.warn. Missing any element is a hard failure.
    check: |
      modified = outputs.get("modified_files", {})
      files = outputs.get("files", {})
      all_files = {**files, **modified}
      conftest = ""
      for k, v in all_files.items():
          if "conftest.py" in k:
              conftest = v
              break
      if not conftest:
          conversation = outputs.get("conversation", "")
          if "asyncio.to_thread" in conversation and "warnings.warn" in conversation:
              return (True, "MLflow enrichment pattern found in conversation")
          return (False, "conftest.py not found in outputs")
      checks = {
          "asyncio.to_thread": "asyncio.to_thread" in conftest,
          "try/except": "except Exception" in conftest or "except:" in conftest,
          "logging.warning": "logging" in conftest and "warning" in conftest.lower(),
          "warnings.warn": "warnings.warn" in conftest,
      }
      missing = [k for k, v in checks.items() if not v]
      if missing:
          return (False, f"MLflow enrichment missing elements: {missing}")
      return (True, "All 4 MLflow enrichment elements present")

  - name: golden_queries_present
    description: |
      Verify golden_queries.yaml was created with the required fields:
      query, expected_tools, expected_elements, difficulty, category.
    check: |
      modified = outputs.get("modified_files", {})
      files = outputs.get("files", {})
      all_files = {**files, **modified}
      golden = ""
      for k, v in all_files.items():
          if "golden_queries" in k:
              golden = v
              break
      if not golden:
          conversation = outputs.get("conversation", "")
          if "golden_queries.yaml" in conversation and "expected_tools" in conversation:
              return (True, "Golden queries file referenced with expected fields in conversation")
          return (False, "golden_queries.yaml not found in outputs")
      required_fields = ["query", "expected_tools", "expected_elements"]
      missing = [f for f in required_fields if f not in golden]
      if missing:
          return (False, f"Golden queries missing fields: {missing}")
      return (True, "Golden queries has all required fields")

  - name: no_agent_code_modified
    description: |
      Verify the skill did NOT modify agent source code (src/, main.py,
      tool definitions, system prompt). The agent is read-only — only
      test scaffolding under tests/behavioral/ is in scope.
    check: |
      modified = outputs.get("modified_files", {})
      violations = []
      for path in modified:
          if any(banned in path for banned in ["/src/", "/main.py", "pyproject.toml"]):
              if "tests/" not in path:
                  violations.append(path)
      if violations:
          return (False, f"Agent source code modified: {violations}")
      return (True, "No agent source code modifications detected")

  - name: implementation_quality
    description: |
      LLM judge evaluating overall implementation quality — correct phase
      sequencing, completeness of test scaffolding, proper MLflow integration,
      documentation updates, and Definition of Done adherence.
    prompt: |
      Evaluate this behavioral test scaffolding implementation:

      {{ conversation }}

      The skill should complete all phases (0-8) plus validation:
      Phase 0: Jira context gathering
      Phase 1: Agent + cluster inspection, deploy via /deploy-agents
      Phase 2: MLflow tracing verification
      Phase 3: Runner compatibility check
      Phase 4: Create test files (conftest.py with MLflow enrichment, test_tool_usage,
               test_response_quality, test_cost_latency, test_reliability, golden_queries.yaml)
      Phase 5: Config updates (thresholds.yaml, pyproject.toml marker)
      Phase 6: Makefile MLflow support check
      Phase 7: Documentation updates (3 files)
      Phase 8: Agent deployment health verification
      Phase 9: Run /run-behavioral-tests validation

      Key quality criteria:
      - conftest.py must have all 4 MLflow enrichment elements
      - STREAM constant must be False by default
      - Agent source code must NOT be modified (only test scaffolding)
      - All 3 documentation files must be updated
      - Bugs discovered in the agent must be filed as Jira bugs

      Score on a 1-5 scale:
      Score 1: Less than half of phases completed, critical files missing
      Score 2: Most phases completed but key quality criteria violated (e.g., agent code modified, MLflow enrichment incomplete)
      Score 3: All phases completed but with gaps (missing docs, incomplete golden queries, no validation run)
      Score 4: All phases completed with minor issues (documentation incomplete, thresholds not calibrated)
      Score 5: All phases completed correctly, validation passed, all Definition of Done items met

  - name: boundary_compliance
    description: |
      LLM judge verifying the skill respected the agent boundary — did NOT
      modify agent source code, properly logged Jira bugs for agent deficiencies,
      and used /deploy-agents for deployment (not manual make deploy).
    prompt: |
      Review this implementation for boundary compliance:

      {{ conversation }}

      Check for these critical boundaries:
      1. Agent source code (src/, main.py, tool definitions) was NEVER modified
      2. Agent bugs/deficiencies were logged as Jira bugs under the parent epic (not fixed in agent code)
      3. Deployment used /deploy-agents skill (not manual make build/push/deploy)
      4. .env files were never committed
      5. Only test scaffolding files were created under tests/behavioral/

      Score on a 1-5 scale:
      Score 1: Agent source code was modified or manual deployment used
      Score 2: Partial boundary violations (e.g., some agent files edited, deployment not via /deploy-agents)
      Score 3: Boundaries mostly respected but bugs not filed as Jira tickets
      Score 4: All boundaries respected, minor documentation gaps about limitations
      Score 5: Perfect boundary compliance — agent read-only, bugs filed, /deploy-agents used, all limitations documented

thresholds:
  budget_check:
    min_pass_rate: 1.0
  test_files_created:
    min_pass_rate: 1.0
  conftest_mlflow_enrichment:
    min_pass_rate: 1.0
  golden_queries_present:
    min_pass_rate: 1.0
  no_agent_code_modified:
    min_pass_rate: 1.0
  implementation_quality:
    min_mean: 3.5
  boundary_compliance:
    min_mean: 4.0
