# LLM answerer guidance for standard agent happy path
parent_epic: "TODO_PARENT_EPIC"  # replace with real epic key
redeploy_existing: true
redeploy_guidance: >
  If asked whether to redeploy an existing agent, answer "redeploy" —
  the agent needs a fresh deployment with current MLflow tokens.
rebuild_image: false
rebuild_guidance: >
  If asked whether to rebuild container images, answer "reuse" unless
  the image doesn't exist yet.
jira_context_guidance: >
  This is a standard behavioral testing ticket. The agent under test
  is google/adk (Google ADK agent). The scope is adding full behavioral
  test coverage including tool usage, response quality, cost/latency,
  and reliability tests.
bug_filing_guidance: >
  If the agent has deficiencies (missing tracing, broken response format),
  file a Jira bug under the parent epic. Answer "yes" to bug filing prompts.
